version: 2
updates:
  - package-ecosystem: npm            # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv             # services/agents (uv.lock)
    directory: /services/agents
    schedule: { interval: weekly }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker         # base images in deploy/docker/*.Dockerfile
    directories: [/deploy/docker]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose # third-party images pinned in deploy/compose.yaml
    directory: /deploy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
