name: Feature request
description: Suggest an improvement to Vigil.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do and what gets in the way? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this touch tenant isolation, credentials, AI tool access or the approval step?
